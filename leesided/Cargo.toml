[package]
name = "leesided"
version = "0.1.0"
edition = "2021"
description = "Leeside engine: ingests turn events, answers the sync rule check, keeps rules and decisions in SQLite"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
schemars = "0.8"
arc-swap = "1"
dashmap = "6"
smallvec = { version = "1", features = ["union", "const_generics"] }
parking_lot = "0.12"
tracing = "0.1"
thiserror = "2"
# Beyond the brief's list, each with its reason:
# tracing-subscriber: the only way to get `tracing` output to stderr; tracing itself emits nothing.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# sha2: RuleSet.hash is sha256 over "id:version"; no other crate in the set provides a hash.
sha2 = "0.10"
# maxminddb: GeoLite2 ASN and country lookups for enrichment at ingest (docs/actors.md); null when the files are absent.
maxminddb = "0.24"
# libc: the tap's AF_PACKET socket (docs/tap.md); no libpcap, so no new system package on the box.
libc = "0.2"

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "eval"
harness = false

[profile.release]
debug = 1
