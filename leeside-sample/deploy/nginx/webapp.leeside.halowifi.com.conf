# Port 80 only; certbot adds the 443 block and the redirect.
server {
    listen 80;
    server_name webapp.leeside.halowifi.com;

    root /var/www/leeside/leeside-sample/public;
    index index.php;

    client_max_body_size 10m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/webapp.leeside.halowifi.com.access.log;
    error_log /var/log/nginx/webapp.leeside.halowifi.com.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
