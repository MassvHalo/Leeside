# Port 80 only; certbot adds the 443 block and the redirect.
#
# The login rate-limit zone lives at http level: on Ubuntu this file
# is included inside the http block (sites-enabled), which is where
# limit_req_zone belongs.
limit_req_zone $binary_remote_addr zone=windside_login:1m rate=5r/m;

server {
    listen 80;
    server_name webapp.leeside.halowifi.com;

    root /var/www/leeside/leeside-sample/public;
    index index.php;

    client_max_body_size 10m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/webapp.leeside.halowifi.com.access.log;
    error_log /var/log/nginx/webapp.leeside.halowifi.com.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # The Windside console, served by the daemon itself at
    # LEESIDED_CONSOLE_PATH (default /windside). No rewrite: the path
    # passes through unchanged.
    location = /windside {
        return 301 /windside/;
    }

    location = /windside/login {
        limit_req zone=windside_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:7390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location /windside/ {
        proxy_pass http://127.0.0.1:7390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
