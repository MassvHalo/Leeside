# The leesided review UI. Port 80 only; certbot adds the 443 block and the
# redirect. Static files from deploy.sh; /api/ goes to leesided, which
# checks the bearer token itself.
server {
    listen 80;
    server_name leeside.halowifi.com;

    root /var/www/leeside-ui;
    index index.html;

    client_max_body_size 1m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    access_log /var/log/nginx/leeside.halowifi.com.access.log;
    error_log /var/log/nginx/leeside.halowifi.com.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:7390/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    }
}
